[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rec-agro-br"
version = "0.1.0a0"
description = "Recomendador de municípios brasileiros por perfil agropecuário via espaço vetorial. Adaptação didática do projeto Cap08 da pós-graduação em Ciência de Dados da Data Science Academy."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Pedro Luiz Rocha Vaz de Melo" },
]
keywords = [
    "data-science",
    "recommender-system",
    "vector-space",
    "cosine-similarity",
    "agropecuary",
    "brazil",
    "ibge",
    "sidra",
    "portfolio",
    "dsa-postgraduate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Núcleo pedagógico do projeto DSA original
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.4,<2.0",
    "nltk>=3.9,<4.0",
    # Coleta de dados IBGE
    "sidrapy>=0.1.4,<0.2",
    "requests>=2.32,<3.0",
    # Utilidades
    "python-dotenv>=1.0,<2.0",
    "tqdm>=4.67,<5.0",
    # Serialização eficiente (para caches intermediários)
    "pyarrow>=15.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1",
    "jupyterlab>=4.4",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "watermark>=2.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# A extensão de mestrado (validação espacial com Moran's I) tem dependências
# geoespaciais pesadas no Windows. Ficam separadas para instalação sob demanda.
spatial = [
    "geopandas>=1.0",
    "libpysal>=4.10",
    "esda>=2.5",
    "contextily>=1.6",
]

[project.urls]
Homepage = "https://github.com/PedroLuizskt/datascience-projects"
Repository = "https://github.com/PedroLuizskt/datascience-projects"
Issues = "https://github.com/PedroLuizskt/datascience-projects/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rec_agro_br"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=rec_agro_br",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marca testes lentos (excluir com '-m \"not slow\"')",
    "network: testes que dependem de acesso à internet",
    "integration: testes de integração ponta a ponta",
]

[tool.coverage.run]
source = ["rec_agro_br"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "notebooks",
    "data",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # linha longa (deixamos o formatter cuidar)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
